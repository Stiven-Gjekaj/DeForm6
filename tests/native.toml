# The pinned measure of the annotated disassembly of each native program.
#
# `cargo test -p deform6 --test native_listing` fails when a number moves,
# and the message gives the new number. Set DEFORM6_PRINT_NATIVE to print
# this table.
#
# `procedures` is what the listing holds. `declared` is what the source
# declares, counted from each source file of the project that is in the
# repository. `Edge_Detection.exe` holds 30 and declares 13, because the
# source of its class `cCommonDialog` is not in the repository.
#
# `instructions` is the count of decoded instructions. A change of the walk
# moves it.
#
# `strings` is the count of string notes. `strings_in_source` is how many of
# them the source holds as a literal. `runtime_calls` is the count of notes
# of an import. `idioms` is how many of them have an idiom.
#
# `checked_calls` is the count of object calls that a check block names. The
# corpus holds 3094 calls of `__vbaHresultCheckObj`, and each one names a call.
#
# `me_calls` is the count of calls through the vtable of the object of the
# procedure.
#
# `instance_calls` is the count of calls through the vtable of the default
# instance of a form.
#
# `numbers` is the count of floating point constants that an instruction
# reads. `numbers_in_source` is how many of them the source holds as a
# literal. The one other is an expression of constants.

