# The gate.
#
# AGENTS.md gives three commands and says to run every one of them, not a
# selection. They run here as three steps, so a reader of a red run sees which
# of the three failed without opening the log.
#
# `cargo test --workspace` is the build check. Never put `cargo build` here.
# `build` does not compile a `#[cfg(test)]` module, so a broken test helper
# passes `build` and fails later under clippy.
name: gate

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: fmt, clippy and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # `rust-toolchain.toml` names the channel and the two components. The
      # version is not repeated here, because two pins drift apart.
      - name: Install the toolchain that rust-toolchain.toml names
        run: rustup show

      - name: Report the versions
        run: |
          rustc --version
          cargo --version
          cargo fmt --version
          cargo clippy --version

      - name: Cache the cargo registry and the target directory
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      # `cargo fmt`, `cargo clippy` and `cargo test` never run `cargo doc`,
      # so a broken intra-doc link or a public doc naming a private item
      # passes the gate silently. This step is the only guard on that.
      # Plan 06-03 measured 52 warning lines on the unrepaired tree and
      # brought the count to zero; `RUSTDOCFLAGS` denies warnings so a
      # pull request cannot reintroduce one without failing this step.
      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --workspace

      # The wall is proved on every run, and not only on the day it was
      # written. The proof steps come after the three gate commands, because
      # each script writes a probe into the source tree and then removes it.
      # This script needs `jq`, which the ubuntu runner image already holds.
      - name: Prove the lint wall
        run: sh scripts/prove-lint-wall.sh

      # The lint wall catches a bad shape written with primitives. It cannot
      # catch a caller that reaches into a `Region` or adds two offsets,
      # because the type refuses those shapes and they never reach a lint.
      # The three commands above are blind to them for the same reason, so
      # this step is the only guard on the three. It would rot silently the
      # first day somebody makes a field public or adds a `Deref`.
      - name: Prove the Region wall
        run: sh scripts/prove-region-wall.sh

      # The lint wall and the region wall both catch a bad shape written
      # by hand. Neither catches an allocation sized from a count that
      # already reached a variable, because that shape is neither a bad
      # primitive nor a type the compiler refuses. This step is the only
      # guard on that one: it fails when a new capacity sized allocation
      # under crates/deform6/src/ has not been traced and added to the
      # audited list the script holds.
      - name: Prove the capacity wall
        run: sh scripts/prove-capacity-wall.sh

      # The three walls above all catch a shape a person writes by hand.
      # None catches a hash keyed container, because a HashMap is ordinary
      # Rust and every lint accepts it. What it breaks is the one thing the
      # gate cannot see: RPT-01 and RPT-05 ask for a byte identical report,
      # and a hash table iterated once puts its own order into the output.
      # The determinism tests pass until the day that order differs. Phase 4
      # wrote this rule as a source assertion in two plan files, which runs
      # once, on the day that plan runs; plan 05-06 then broke it for four
      # commits. This step is that rule where it runs every time.
      - name: Prove the ordered output wall
        run: sh scripts/prove-ordered-output-wall.sh
