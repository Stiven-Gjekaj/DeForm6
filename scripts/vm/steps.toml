# frmHistogram tab order: picH 0, cmbHistMethod 1, cmbHistSource 2, picGradient 5. Start: source Luminance (3), method Connecting lines (0).
# Step 1: Tab to cmdDispHistogram, space shows and activates frmHistogram.
# Step 2: Tab to cmbHistMethod, Down arrow selects Solid bars; cmbHistMethod_Click draws the bar histogram.
# Step 3: Tab to cmbHistSource, Up arrow selects Blue; the blue histogram and a blue gradient are drawn.
# Step 4: Up arrow selects Green.
# Step 5: Up arrow selects Red.
# Step 6: Shift+Tab to cmbHistMethod, Up arrow selects Connecting lines; the red histogram is drawn as lines.
steps = [
  "{TAB} ",
  "{TAB}{DOWN}",
  "{TAB}{UP}",
  "{UP}",
  "{UP}",
  "+{TAB}{UP}",
]

[[program]]
key = "vb6-code/Levels-effect/Image Levels.exe"
# Focus starts on picMain (0). Tab order: picMain 0, cmdDispHistogram 1, hsOutL 5, hsOutR 9, hsInR 12, hsInL 13, hsInM 18, cmdReset 23. cmdDispHistogram is never pressed.
# Each arrow key gives one Change event and one MapImageLevels pass on the 256x192 image, so a step holds at most 20 of them.
# Step 1: Tab twice to hsOutL, Right arrow 10 times moves the output left limit from 0 to 10.
# Step 2: Tab to hsOutR, Left arrow 10 times moves the output right limit from 255 to 245.
# Step 3: Tab to hsInR, Left arrow 10 times moves the input right limit to 245; FixScrollBars moves the midtone bar.
# Step 4: Tab to hsInL, Right arrow 10 times moves the input left limit to 10.
# Step 5: Tab to hsInM, Left arrow 20 times moves the midtone (gamma) bar down.
# Step 6: Tab to cmdReset, space runs cmdReset_Click, which sets all bars back and redraws.
# Step 7: Shift+Tab to hsInM, End moves the midtone to its maximum (254); the image becomes darker. All values are fixed, nothing is random.
steps = [
  "{TAB}{TAB}{RIGHT 10}",
  "{TAB}{LEFT 10}",
  "{TAB}{LEFT 10}",
  "{TAB}{RIGHT 10}",
  "{TAB}{LEFT 20}",
  "{TAB} ",
  "+{TAB}{END}",
]


[[program]]
key = "vb6-code/Mandelbrot/Mandelbrot.exe"
# The focus starts on PicDraw (TabIndex 0). The tab order is TxtXMin, TxtXMax, TxtYMin, TxtYMax, CmdRedraw, scrAccuracy, CmdReset.
# The default frame holds the set, and many points recurse to IterationLimit 400. That render is too slow, so no step presses Reset or draws the default frame.
# The steps set the frame to X 1..2, Y 0..1. A simulation of Calculate gives a mean of 1.1 recursions and a maximum of 7 for each pixel there, so the render of 601x601 pixels is fast.
# Step 1: Tab to TxtXMin, select all, type 1. No Rnd, no time.
# Step 2: Tab to TxtXMax, select all, type 2.
# Step 3: Tab to TxtYMin, select all, type 0.
# Step 4: Tab to TxtYMax, select all, type 1.
# Step 5: Tab to CmdRedraw and press it. CmdRedraw_Click runs Calculate and SetPixelV for each pixel and sets the caption to "Redraw the Fractal". The image depends only on the four text values. If the VM is slow, the render can still run at the screenshot; the time was not measured.
steps = [
  "{TAB}{HOME}+{END}1",
  "{TAB}{HOME}+{END}2",
  "{TAB}{HOME}+{END}0",
  "{TAB}{HOME}+{END}1",
  "{TAB} ",
]

[[program]]
key = "vb6-code/Map-editor-2D/Map Editor.exe"
# Form_Load reads Demo.map and calls DrawMap. The focus starts on PicTiles (TabIndex 0). The tab order is PicTiles, Pic1, MainPic, HSTileBar, VSMain, HSMain, Pic2, cmbDrawMethod. PicTilesBuffer is not visible.
# Step 1: three Tabs to HSTileBar, then RIGHT. HSTileBar_Change calls DrawTileBar with PaintPicture, and the tile bar moves by one tile.
# Step 2: Tab to VSMain, END. VSMain_Change calls ScrollMap and DrawMap (PaintPicture). The map scrolls to the bottom (Max 833).
# Step 3: Tab to HSMain, END. HSMain_Change scrolls the map to the right edge (Max 473).
# Step 4: two Tabs (Pic2, cmbDrawMethod), DOWN. cmbDrawMethod_Click sets UseStretchBlt to True. The combo box shows "Use StretchBlt".
# Step 5: two Shift+Tabs back to HSMain, HOME. DrawMap runs again, now with StretchBlt, and the map scrolls back to the left.
# Step 6: Shift+Tab to VSMain, HOME. DrawMap with StretchBlt scrolls back to the top.
# Step 7: Shift+Tab to HSTileBar, END. DrawTileBar with StretchBlt shows the last tiles (value 3).
# Step 8: Ctrl+N (File > New Map). MnuNew_Click sets all tiles to 0 and calls DrawMap. No dialog, no file. Ctrl+O, Ctrl+S, Ctrl+X and Ctrl+Z (InputBox) are not used.
steps = [
  "{TAB}{TAB}{TAB}{RIGHT}",
  "{TAB}{END}",
  "{TAB}{END}",
  "{TAB}{TAB}{DOWN}",
  "+{TAB}+{TAB}{HOME}",
  "+{TAB}{HOME}",
  "+{TAB}{END}",
  "^n",
]

[[program]]
key = "vb6-code/Nature-effects/Nature_Filters.exe"
# Form_Load loads sample.jpg. The focus starts on picMain (TabIndex 0). picBack is not visible, so Tab goes to lstFilters and then to cmdReset.
# Each list move fires lstFilters_Click and UpdateEffect. Each filter is a fixed pixel formula on picBack, with no Rnd and no time.
# Step 1: Tab to the list, HOME. DrawAtmosphere.
# Step 2: DOWN. DrawBurn.
# Step 3: DOWN. DrawFog.
# Step 4: DOWN. DrawFreeze.
# Step 5: DOWN twice. DrawLava runs, then DrawMetal shows.
# Step 6: DOWN twice. DrawOcean runs, then DrawRainbow (HSL conversion) shows.
# Step 7: END. DrawWater.
# Step 8: Tab to cmdReset, Space. cmdReset_Click copies picBack back to picMain and clears the list selection.
steps = [
  "{TAB}{HOME}",
  "{DOWN}",
  "{DOWN}",
  "{DOWN}",
  "{DOWN}{DOWN}",
  "{DOWN}{DOWN}",
  "{END}",
  "{TAB} ",
]

[[program]]
key = "vb6-code/Randomize-effects/RandomizationFX.exe"
# Both effects call Randomize Timer and Rnd, so the default effect differs on each run.
# The steps set Line Length to 1. Then lenHalf is 0 and Int(Rnd * 1) is 0, so each line or triangle is one point at (x, y), and its color is the color of that same pixel.
# Thus the image stays equal to the original for every Rnd sequence. The code runs, but the picture does not change. A crash or a wrong length rule shows on the screen.
# The focus starts on picMain. The tab order is cmdDrawLines, txtIterations, txtLength, cmdReset, cmdDrawTriangles. picBack is not visible.
# Step 1: two Tabs to txtIterations, select all, type 10.
# Step 2: Tab to txtLength, select all, type 1.
# Step 3: two Shift+Tabs to cmdDrawLines, Space. DrawLineEffect runs 11 one-point lines.
# Step 4: four Tabs to cmdDrawTriangles, Space. DrawTriangleEffect runs 11 one-point polygons.
# Step 5: Shift+Tab to cmdReset, Space. cmdReset_Click copies picBack to picMain.
steps = [
  "{TAB}{TAB}{HOME}+{END}10",
  "{TAB}{HOME}+{END}1",
  "+{TAB}+{TAB} ",
  "{TAB}{TAB}{TAB}{TAB} ",
  "+{TAB} ",
]

[[program]]
key = "vb6-code/Scanner-TWAIN/VB_Scanner_Support.exe"
# No safe step. EZTW32.dll is not in the program folder. Form_Load calls TWAIN_IsAvailable through a Declare on EZTW32.dll with no error handler.
# This gives run-time error 53 at load, and the program ends before the form shows. If the DLL were present, both buttons open a TWAIN dialog or a MsgBox, and the option buttons have no event code.
steps = []

[[program]]
key = "vb6-code/Screen-capture/ScreenCapture.exe"
# No safe step. The only code is Form_Load, which copies the whole screen into the form. That picture depends on what is behind the window, so it is not the same on both sides.
# The form has no control that takes the focus and no key procedure, so no key runs code.
steps = []

[[program]]
key = "vb6-code/Sepia-effect/Sepia.exe"
# Form_Load loads sample.jpg. The focus starts on picMain (TabIndex 0). picBack is not visible, so Tab goes to cmdSepia and then to cmdReset.
# DrawSepia reads picMain and writes picMain, so a second press applies the effect again on the result. It is a fixed formula with no Rnd.
# Step 1: Tab to cmdSepia, Space. Sepia once.
# Step 2: Space. Sepia twice.
# Step 3: Tab to cmdReset, Space. LoadImageAutosized copies picBack to picMain.
# Step 4: Shift+Tab to cmdSepia, Space. Sepia once on the original.
# Step 5: Tab to cmdReset, Space. Original again.
steps = [
  "{TAB} ",
  " ",
  "{TAB} ",
  "+{TAB} ",
  "{TAB} ",
]

[[program]]
key = "vb6-code/Threshold-effect/Threshold.exe"
# Form_Load loads sample.jpg and draws the threshold 127. The focus starts on picMain. The tab order is cmdReset, hscrThreshold, chkWhite. picBack is not visible.
# Each scroll bar move fires hscrThreshold_Change, which sets lblThreshold and calls DrawThreshold. It is a fixed formula with no Rnd.
# Step 1: two Tabs to the scroll bar, RIGHT. The threshold is 128.
# Step 2: PGDN. LargeChange is 10, so the threshold is 138.
# Step 3: END. The threshold is 255, and the image is all black.
# Step 4: HOME. The threshold is 0.
# Step 5: PGDN ten times. The threshold is 100.
# Step 6: Tab to chkWhite, Space. chkWhite_Click forces the pixels above 100 to white.
# Step 7: Space. The check box clears, and the colors come back.
# Step 8: two Shift+Tabs to cmdReset, Space. cmdReset_Click shows the original image.
steps = [
  "{TAB}{TAB}{RIGHT}",
  "{PGDN}",
  "{END}",
  "{HOME}",
  "{PGDN 10}",
  "{TAB} ",
  " ",
  "+{TAB}+{TAB} ",
]

[[program]]
key = "vb6-code/Transparency-2D/Transparency.exe"
# Form_Load blends the two pictures at 50 percent. Picture1 and Picture2 are not visible, so the focus starts on Picture3 and Tab goes to hScroll1.
# Each move fires hScroll1_Change, which calls DrawTransparency with the scroll value. It is a fixed blend with no Rnd. LargeChange is 1.
# Step 1: Tab to the scroll bar, RIGHT. 51 percent.
# Step 2: END. 100 percent, only the second picture.
# Step 3: HOME. 0 percent, only the first picture.
# Step 4: RIGHT 25 times. 25 percent.
# Step 5: LEFT. 24 percent.
steps = [
  "{TAB}{RIGHT}",
  "{END}",
  "{HOME}",
  "{RIGHT 25}",
  "{LEFT}",
]
