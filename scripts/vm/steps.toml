# The keys that the behaviour check sends to each program of the P-code
# corpus, past its first window. `export-lift-builds` writes the steps of
# each program to steps\pNN.txt, and drive.vbs sends each step with
# SendKeys, with a picture after it. The key of a program is its path
# relative to corpus-pcode/. A step changes nothing that differs from run
# to run: no random value, no time, no network, no file dialog.
# The steps of one program build on each other: the focus stays where the
# last step left it.

# Keyboard test steps for p01, p03 to p13 (p02 is skipped: it locks the session).

[[program]]
key = "public-domain/HexScroll/Hex Scroll.exe"
# Focus starts on HsRed (TabIndex 0).
# 1. END moves HsRed to 255. HsRed_Change calls updateValues: BackColor, TxtRed, TxtHex, TxtRGB change.
# 2. TAB to HsGreen, END moves it to 255. HsGreen_Change gives a yellow form and #FFFF00.
# 3. TAB to HsBlue, four RIGHT keys move it to 4. HsBlue_Change gives #FFFF04.
# 4. TAB to TxtRed, select all, type 128. TxtRed_Change sets HsRed and calls updateValues for 1, 12, 128.
# 5. TAB to TxtGreen, select all, type 64. TxtGreen_Change sets HsGreen to 64.
# All values are fixed. F5 (Rnd), Escape (End), Copy (clipboard and caption timer) and Close are not pressed.
steps = [
  "{END}",
  "{TAB}{END}",
  "{TAB}{RIGHT}{RIGHT}{RIGHT}{RIGHT}",
  "{TAB}{HOME}+{END}128",
  "{TAB}{HOME}+{END}64",
]

