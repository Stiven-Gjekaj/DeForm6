# 3. TAB past chkNumChars to chkSpecialChars, SPACE clears it. chkSpecialChars_Click runs; Value is 0, so no MsgBox.
# 4. SPACE sets chkSpecialChars again. specialString holds 32 characters (2 are needed), so no MsgBox.
# 5. TAB past cmdSpecial to chkSpaces, SPACE sets it.
# 6. TAB to cmbNumber (Dropdown List), DOWN changes 64 to 65.
# 7. TAB to cmbLength, DOWN DOWN changes 16 to 18.
# chkAutomatic (60 s timer), Escape and Close (registry write, End) are not pressed.
steps = [
  " ",
  "{TAB} ",
  "{TAB}{TAB} ",
  " ",
  "{TAB}{TAB} ",
  "{TAB}{DOWN}",
  "{TAB}{DOWN}{DOWN}",
]

